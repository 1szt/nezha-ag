name: Auto Build and Push

on:
  schedule:
    - cron: '0 * * * *' # 每小时执行一次，自动检查
  workflow_dispatch:     # 允许你手动点击立即构建
    inputs:
      force_build:
        description: '强制构建，即使版本已存在'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get Latest Version
        id: get_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/nezhahq/agent/releases/latest | jq -r .tag_name)
          echo "latest_version=$VERSION" >> $GITHUB_OUTPUT
          
          # 检查该版本是否已存在
          TAGS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/user/packages/container/nezha-ag/versions | jq -r '[.[]?.metadata?.container?.tags // []] | flatten')
          if echo "$TAGS" | grep -q "$VERSION"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU & Buildx
        if: steps.get_version.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        if: steps.get_version.outputs.exists == 'false' || inputs.force_build == true

      - name: Login to GHCR
        if: steps.get_version.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: steps.get_version.outputs.exists == 'false' || inputs.force_build == true
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: NEZHA_VERSION=${{ steps.get_version.outputs.latest_version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.latest_version }}