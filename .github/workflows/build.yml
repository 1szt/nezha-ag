name: Auto Build and Push

on:
  schedule:
    - cron: '0 * * * *' # 每小时执行一次，自动检查
  workflow_dispatch:     # 允许你手动点击立即构建

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get Latest Version
        id: get_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/nezhahq/agent/releases/latest | jq -r .tag_name)
          echo "latest_version=$VERSION" >> $GITHUB_OUTPUT
          
          # 检查该版本是否已存在
          EXISTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/user/packages/container/nezha-ag/versions | jq -r '.[]?.metadata?.container?.tags // [] | any(. == "'"$VERSION"'") | tostring')
          # 如果jq返回空或错误，默认设为false（表示版本不存在）
          if [ -z "$EXISTS" ] || [ "$EXISTS" = "null" ]; then
            EXISTS="false"
          fi
          echo "exists=${EXISTS}" >> $GITHUB_OUTPUT

      - name: Set up QEMU & Buildx
        if: steps.get_version.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        if: steps.get_version.outputs.exists == 'false'

      - name: Login to GHCR
        if: steps.get_version.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: steps.get_version.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: NEZHA_VERSION=${{ steps.get_version.outputs.latest_version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.latest_version }}